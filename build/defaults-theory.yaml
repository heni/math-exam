# Сборка конспекта теории: Markdown + TeX -> xelatex -> PDF.
# Пути в resource-path/include-in-header заданы относительно корня проекта,
# поэтому pandoc запускается ИЗ КОРНЯ (см. Makefile), а не из каталога вопроса.
to: latex
pdf-engine: xelatex
number-sections: true
toc: true
toc-depth: 2
include-in-header:
  - build/preamble-theory.tex
resource-path:
  - .
  - assets
variables:
  documentclass: scrartcl
  # Одна колонка, кегль 10, поля 20 мм: конспект читают как справку, и
  # плотность важнее воздуха. Двухколоночная вёрстка проверена измерением и
  # отвергнута — выкладки шире колонки (разбор в docs/build.md, раздел
  # «Вёрстка конспекта»). Широкие таблицы набираются сырым LaTeX, а не
  # markdown: pandoc превращает markdown-таблицы в longtable.
  classoption:
    - parskip=half
  mainfont: DejaVu Serif
  sansfont: Lato
  monofont: DejaVu Sans Mono
  lang: ru
  fontsize: 10pt
  geometry: margin=20mm
  linestretch: 1.0
  colorlinks: true
  linkcolor: teal
  urlcolor: teal
  toc-title: Содержание
