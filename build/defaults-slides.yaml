# Сборка презентации: Markdown + TeX -> beamer (metropolis) -> xelatex -> PDF.
# Запускается из корня проекта (см. Makefile).
to: beamer
pdf-engine: xelatex
slide-level: 2
include-in-header:
  - build/preamble-slides.tex
resource-path:
  - .
  - assets
variables:
  theme: metropolis
  themeoptions:
    - progressbar=frametitle
    - numbering=fraction
    - block=fill
  sansfont: Lato
  monofont: DejaVu Sans Mono
  aspectratio: 169
  fontsize: 10pt
  lang: ru
  colorlinks: true
  linkcolor: teal
